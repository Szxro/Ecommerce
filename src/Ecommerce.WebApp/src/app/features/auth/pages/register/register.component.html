<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <label for="firstName">Firstname: </label>
  <input type="text" id="firstName" formControlName="firstName"/>
  <span errorMessage [target]="registerForm.controls.firstName"></span>

  <label for="lastName">Lastname: </label>
  <input type="text" id="lastName" formControlName="lastName"/>
  <span errorMessage [target]="registerForm.controls.lastName"></span>

  <label for="userName">Username: </label>
  <input type="text" id="userName" formControlName="username"/>
  <span errorMessage [target]="registerForm.controls.username"></span>

  <label for="email">Email: </label>
  <input type="email" id="email" formControlName="email"/>
  <span errorMessage [target]="registerForm.controls.email"></span>

  <label for="password">Password: </label>
  <input type="password" id="password" formControlName="password"/>
  <span errorMessage [target]="registerForm.controls.password"></span>

  <label for="confirmPassword">Confirm password: </label>
  <input type="password" id="confirmPassword" formControlName="confirmPassword"/>
  <span errorMessage [target]="registerForm.controls.confirmPassword"></span>

  <button type="submit" [disabled]="!registerForm.valid">Register</button>
</form>


<!--Login callout-->
<div>
  <p>Already have an account in Ecommerce?
      <a routerLink="/auth/login">Log in</a>
  </p>
</div>

<pre>{{registerForm.value | json}}</pre>
